{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    {% block meta %} {% endblock meta %}
</head>
<body>
  <header class="site-header">
    <div class="container">
        <a href="{% url 'main:show_main' %}" class="brand">{{ name }}</a>
        <nav>
            <a href="{% url 'main:show_main' %}">Profile</a>
            <a href="{% url 'main:show_experience' %}">Experience</a>
            <a href="{% url 'main:show_skills' %}">Skills</a>
        </nav>
    </div>
  </header>

<!-- Kreativitas Tugas 3: Floating Toast Notifications untuk Messages -->
  {% if messages %}
    <div id="toast-container" class="toast-container">
      {% for message in messages %}
        <div class="toast toast-{{ message.tags }}">
          <span class="toast-icon">✦</span>
          <span class="toast-text">{{ message }}</span>
          <button type="button" class="toast-close" onclick="this.parentElement.remove()">&times;</button>
        </div>
      {% endfor %}
    </div>

    <!-- Menutup toast setelah 3.5 detik -->
    <script>
      setTimeout(() => {
        const toasts = document.querySelectorAll('.toast');
        toasts.forEach(t => {
          t.style.animation = 'toastFadeOut 0.4s ease forwards';
          setTimeout(() => t.remove(), 400);
        });
      }, 3500);
    </script>
  {% endif %}

  {% block content %} {% endblock content %}

  <footer class="site-footer">
      <div class="container">
          <p>&copy; 2026 Khayla. Fakultas Ilmu Komputer, Universitas Indonesia.</p>
      </div>
  </footer>
</body>
</html>
