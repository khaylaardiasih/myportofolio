{% extends 'base.html' %}

{% block meta %}
    <title>{{ name }} - Portofolio</title>
{% endblock meta %}

{% block content %}
<main>
    <section class="hero" id="profile">
        <span class="sparkle sparkle-pink sp-1">✦</span>
        <span class="sparkle sparkle-gold sp-2">✧</span>
        <span class="sparkle sparkle-gold sp-3">⋆</span>
        <span class="sparkle sparkle-pink sp-4">✦</span>
        <span class="sparkle sparkle-pink sp-5">⋆</span>
        <span class="sparkle sparkle-gold sp-6">✦</span>
        <span class="sparkle sparkle-gold sp-7">✧</span>
        <span class="sparkle sparkle-pink sp-8">✧</span>

        <div class="container hero-grid">
            <div class="hero-identity">
                <p class="role-tag">Information Systems &middot; Universitas Indonesia</p>
                <h1>{{ name }}</h1>
            </div>
            <div class="hero-photo">
                <div class="photo-block"></div>
                <img class="avatar" src="/static/img/ProfilePBP.png" alt="Photo of {{ name }}">
            </div>
            <div class="hero-details">
                <p class="bio">{{ bio }}</p>
                <dl class="meta-list">
                    <div class="meta-row">
                        <dt>NPM</dt>
                        <dd>{{ npm }}</dd>
                    </div>
                    <div class="meta-row">
                        <dt>Program</dt>
                        <dd>{{ study_program }}</dd>
                    </div>
                </dl>
                <div class="social-links">
                    <a href="https://github.com/khaylaardiasih" class="social-link" target="_blank">GitHub</a>
                    <a href="https://www.linkedin.com/in/khayla-syafira-ardiasih-30775b378/" class="social-link" target="_blank">LinkedIn</a>
                    <a href="mailto:khaylasyafira08@gmail.com" class="social-link">Email</a>
                </div>
            </div>
        </div>
    </section>
</main>
{% endblock content %}
