<form method="post" action="{% url 'main:toggle_star' skill.id %}" class="star-form">
    {% csrf_token %}
    <button type="submit"
            class="button button-star{% if user in skill.starred_by.all %} is-starred{% endif %}"
            title="{% if skill.starred_by.all %}Dibintangi oleh {{ skill.starred_by.all|join:', ' }}{% else %}Beri star pertama{% endif %}">
        <span aria-hidden="true">★</span>
        {% if user in skill.starred_by.all %}Unstar{% else %}Star{% endif %}
        <span class="star-count">{{ skill.starred_by.count }}</span>
    </button>
</form>
