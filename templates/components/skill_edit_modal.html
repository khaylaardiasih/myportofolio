<!-- Modal Edit Keahlian (Kreativitas: In-Page Edit Modal via AJAX PATCH) -->
<div id="edit-skill-modal"
     class="project-form-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="edit-skill-modal-title">
    <button type="button"
            class="project-form-modal__backdrop"
            onclick="closeEditSkillModal()"
            aria-label="Tutup form"></button>

    <div class="project-form-modal__content">
        <button type="button"
                class="project-form-modal__close"
                onclick="closeEditSkillModal()"
                aria-label="Tutup form">×</button>

        <h2 id="edit-skill-modal-title">Ubah Keahlian</h2>
        <form id="edit-skill-form" class="project-form">
            <input type="hidden" id="edit-skill-id" name="id">

            <div class="form-group">
                <label for="edit-skill-name">Nama Keahlian</label>
                <input type="text" id="edit-skill-name" name="name" class="form-input" required placeholder="Contoh: Django REST Framework">
            </div>

            <div class="form-group">
                <label for="edit-skill-category">Kategori</label>
                <select id="edit-skill-category" name="category" class="form-select" required>
                    <option value="hard">Hard Skills</option>
                    <option value="soft">Soft Skills</option>
                </select>
            </div>

            <!-- KREATIVITAS: Slider interaktif dengan angka persentase real-time -->
            <div class="form-group">
                <label for="edit-skill-proficiency">
                    Tingkat Kemampuan: <span id="edit-proficiency-val" style="color: var(--accent, #ea5a8c); font-weight: bold;">80</span>%
                </label>
                <input type="range" id="edit-skill-proficiency" name="proficiency" min="1" max="100" value="80"
                       oninput="document.getElementById('edit-proficiency-val').textContent = this.value">
            </div>

            <div class="form-group">
                <label for="edit-skill-description">Deskripsi</label>
                <textarea id="edit-skill-description" name="description" rows="3" placeholder="Deskripsi singkat keahlian..."></textarea>
            </div>

            <div class="form-group">
                <label for="edit-skill-logo">URL Logo / Ikon (Opsional)</label>
                <input type="url" id="edit-skill-logo" name="logo_url" placeholder="https://example.com/logo.png">
            </div>

            <div class="project-form-modal__actions">
                <button type="button" class="button button-secondary" onclick="closeEditSkillModal()">Batal</button>
                <button type="submit" class="button">Simpan Perubahan</button>
            </div>
        </form>
    </div>
</div>
