<div id="add-skill-modal"
     class="project-form-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="add-skill-modal-title">
    <button type="button"
            class="project-form-modal__backdrop"
            popovertarget="add-skill-modal"
            popovertargetaction="hide"
            aria-label="Tutup form"></button>

    <div class="project-form-modal__content">
        <button type="button"
                class="project-form-modal__close"
                popovertarget="add-skill-modal"
                popovertargetaction="hide"
                aria-label="Tutup form">×</button>

        <h2 id="add-skill-modal-title">Tambah Keahlian Baru</h2>
        <form id="skill-form" method="post" action="{% url 'main:create_skill' %}" class="project-form">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% for error in field.errors %}
                        <p class="form-error">{{ error }}</p>
                    {% endfor %}
                </div>
            {% endfor %}
            <div class="project-form-modal__actions">
                <button type="button"
                        class="button button-secondary"
                        popovertarget="add-skill-modal"
                        popovertargetaction="hide">Batal</button>
                <button type="submit" class="button">Tambah Keahlian</button>
            </div>
        </form>
    </div>
</div>
